<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Token Printer MTG</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9800">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --success-color: #4CAF50;
            --btn-bg: #2d2d2d;
            --btn-hover: #3d3d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #mic-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 1rem;
        }

        #mic-btn:active {
            transform: scale(0.95);
        }

        #mic-btn.listening {
            background-color: var(--accent-color);
            color: var(--bg-color);
            animation: pulse 1.5s infinite;
        }

        #status-text {
            font-size: 1rem;
            color: #aaaaaa;
            min-height: 1.5em;
            margin-bottom: 1.5rem;
        }

        #manual-search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
        }

        #manual-input {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--btn-hover);
            background-color: var(--btn-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        #search-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-hover);
            color: var(--text-color);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #quick-counters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 384px;
        }

        .counter-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .counter-btn:active {
            transform: scale(0.95);
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        #result-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            min-height: 1.5em;
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        #set-selector-container {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 384px;
            margin-bottom: 15px;
            text-align: left;
        }

        #set-selector-container label {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-weight: bold;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--btn-hover);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .image-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        .image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        #token-image {
            display: block;
            width: 384px;
            max-width: 100%;
            border-radius: 8px;
        }

        #dithered-canvas {
            display: block;
            width: 384px;
            max-width: 100%;
            background-color: white;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        #image-controls {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 384px;
            background: var(--btn-bg);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .slider-group label {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .slider-group label span {
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        #print-btn {
            display: none;
            background-color: var(--success-color);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 40px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            width: 100%;
            max-width: 300px;
        }

        #print-btn:active {
            transform: scale(0.95);
            background-color: #45a049;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
    </style>
</head>
<body>

    <h1>Générateur de Token</h1>
    
    <button id="mic-btn" aria-label="Lancer la reconnaissance vocale">🎤</button>
    <div id="status-text">Appuie pour parler...</div>

    <div id="manual-search-container">
        <input type="text" id="manual-input" placeholder="Ou tape un nom (ex: chevalier 2/2)...">
        <button id="search-btn" aria-label="Rechercher">🔍</button>
    </div>

    <div id="quick-counters">
        <button class="counter-btn" onclick="generateCounter('+1 / +1')">+1 / +1</button>
        <button class="counter-btn" onclick="generateCounter('+5 / +5')">+5 / +5</button>
        <button class="counter-btn" onclick="generateCounter('-1 / -1')">-1 / -1</button>
        <button class="counter-btn" onclick="generateCounter('Vol')">Vol</button>
    </div>
    
    <div id="result-text"></div>

    <div id="set-selector-container">
        <label for="set-select">Illustration :</label>
        <select id="set-select"></select>
    </div>
    
    <div class="image-container">
        <div class="image-wrapper" id="original-wrapper" style="display: none;">
            <div class="image-label">Source Scryfall</div>
            <img id="token-image" src="" alt="Aperçu Original" crossorigin="anonymous">
        </div>
        
        <div class="image-wrapper" id="dithered-wrapper" style="display: none;">
            <div class="image-label" id="canvas-label">Prêt pour l'impression</div>
            <canvas id="dithered-canvas"></canvas>
        </div>
    </div>

    <div id="image-controls">
        <div class="slider-group">
            <label for="algo-mode">Mode de rendu :</label>
            <select id="algo-mode">
                <option value="atkinson">Tramage d'Atkinson (Nuances)</option>
                <option value="threshold">Noir & Blanc basique (Seuillage)</option>
            </select>
        </div>
        <div class="slider-group">
            <label for="brightness">Luminosité : <span id="bright-val">30</span></label>
            <input type="range" id="brightness" min="-50" max="100" value="30">
        </div>
        <div class="slider-group">
            <label for="contrast">Contraste : <span id="contr-val">1.35</span></label>
            <input type="range" id="contrast" min="0.5" max="2.5" step="0.05" value="1.35">
        </div>
    </div>

    <button id="print-btn">🖨️ Connecter & Imprimer (v5)</button>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const resultText = document.getElementById('result-text');
        const tokenImage = document.getElementById('token-image');
        const originalWrapper = document.getElementById('original-wrapper');
        const ditheredWrapper = document.getElementById('dithered-wrapper');
        const canvasLabel = document.getElementById('canvas-label');
        const manualInput = document.getElementById('manual-input');
        const searchBtn = document.getElementById('search-btn');
        const printBtn = document.getElementById('print-btn');
        const ditheredCanvas = document.getElementById('dithered-canvas');
        const ctx = ditheredCanvas.getContext('2d', { willReadFrequently: true });
        
        const setSelectorContainer = document.getElementById('set-selector-container');
        const setSelect = document.getElementById('set-select');
        
        const imageControls = document.getElementById('image-controls');
        const brightnessSlider = document.getElementById('brightness');
        const contrastSlider = document.getElementById('contrast');
        const algoModeSelect = document.getElementById('algo-mode');
        const brightVal = document.getElementById('bright-val');
        const contrVal = document.getElementById('contr-val');

        const PRINTER_WIDTH = 384; 

        const BLE_SERVICE_UUID = "0000ff00-0000-1000-8000-00805f9b34fb";
        const BLE_CHARACTERISTIC_UUID = "0000ff02-0000-1000-8000-00805f9b34fb";
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        let currentTokensList = [];
        let currentSearchTerm = "";

        const tokenDictionary = {
            "tresor": "treasure", "elfe": "elf", "nourriture": "food", "orque": "orc",
            "armee d'orques": "orc army", "gobelin": "goblin", "bete": "beast",
            "humain": "human", "soldat": "soldier", "zombie": "zombie", "esprit": "spirit",
            "dinosaure": "dinosaur", "plante": "plant", "chevalier": "knight", 
            "ange": "angel", "dragon": "dragon", "vampire": "vampire",
            "carte": "map", "indice": "clue", "sang": "blood", "copie": "copy",
            "golem": "golem", "construction": "construct", "oiseau": "bird"
        };

        function resetUI() {
            originalWrapper.style.display = "none";
            ditheredWrapper.style.display = "none";
            printBtn.style.display = "none";
            imageControls.style.display = "none";
            setSelectorContainer.style.display = "none";
        }

        window.generateCounter = function(text) {
            resetUI();
            resultText.textContent = "Marqueur : " + text;
            statusText.textContent = "Génération du marqueur...";
            
            const width = PRINTER_WIDTH;
            const height = 200; 
            
            ditheredCanvas.width = width;
            ditheredCanvas.height = height;
            
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, width, height);
            
            ctx.strokeStyle = "black";
            ctx.lineWidth = 8;
            ctx.strokeRect(10, 10, width - 20, height - 20);
            ctx.lineWidth = 2;
            ctx.strokeRect(22, 22, width - 44, height - 44);

            ctx.fillStyle = "black";
            ctx.font = text.length > 5 ? "bold 70px sans-serif" : "bold 100px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, width / 2, height / 2);

            ditheredWrapper.style.display = "flex";
            canvasLabel.textContent = "Prêt pour l'impression (Dessiné localement)";
            printBtn.style.display = "block";
            statusText.textContent = "Prêt à imprimer !";
        };

        brightnessSlider.addEventListener('input', () => { brightVal.textContent = brightnessSlider.value; if (tokenImage.src && originalWrapper.style.display !== "none") processImageToCanvas(tokenImage); });
        contrastSlider.addEventListener('input', () => { contrVal.textContent = contrastSlider.value; if (tokenImage.src && originalWrapper.style.display !== "none") processImageToCanvas(tokenImage); });
        algoModeSelect.addEventListener('change', () => { if (tokenImage.src && originalWrapper.style.display !== "none") processImageToCanvas(tokenImage); });

        setSelect.addEventListener('change', (e) => {
            const selectedIndex = e.target.value;
            displayCard(currentTokensList[selectedIndex]);
        });

        function processQuery(text) {
            resultText.textContent = text;
            
            let ptStats = null;
            const ptMatch = text.match(/(\d+)\s*(?:\/|sur|x|-)\s*(\d+)/i);
            let textWithoutPt = text;
            
            if (ptMatch) {
                ptStats = { pow: ptMatch[1], tou: ptMatch[2] };
                textWithoutPt = text.replace(ptMatch[0], '');
            }

            let normalizedText = textWithoutPt.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let cleanWord = normalizedText.replace(/\b(imprime|un|une|le|la|les|des|de|jeton)\b/g, '').trim();
            cleanWord = cleanWord.replace(/\s+/g, ' '); 
            let englishTerm = tokenDictionary[cleanWord] || cleanWord;
            
            currentSearchTerm = englishTerm; 
            resetUI();
            
            fetchTokenFromScryfall(englishTerm, ptStats);
        }

        searchBtn.addEventListener('click', () => { if (manualInput.value) processQuery(manualInput.value); });
        manualInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && manualInput.value) { manualInput.blur(); processQuery(manualInput.value); } });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.textContent = "Reconnaissance vocale non supportée.";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            micBtn.addEventListener('click', () => recognition.start());
            recognition.onstart = () => { micBtn.classList.add('listening'); statusText.textContent = "Je t'écoute..."; resetUI(); manualInput.value = ""; };
            recognition.onspeechend = () => micBtn.classList.remove('listening');
            recognition.onresult = (e) => processQuery(e.results[0][0].transcript);
            recognition.onerror = (e) => { micBtn.classList.remove('listening'); statusText.textContent = `Erreur : ${e.error}`; };
        }

        async function fetchTokenFromScryfall(tokenName, ptStats = null) {
            const displayPt = ptStats ? ` (${ptStats.pow}/${ptStats.tou})` : "";
            statusText.textContent = `Recherche de "${tokenName}"${displayPt}...`;
            
            try {
                let baseQuery = `t:token name:"${tokenName}"`;
                if (ptStats) {
                    baseQuery += ` pow:${ptStats.pow} tou:${ptStats.tou}`;
                }
                
                const ltrQuery = `${baseQuery} (set:ltr OR set:ltc)`;
                
                let url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(ltrQuery)}&unique=prints`;
                let response = await fetch(url);
                let data = await response.json();

                if (!data.data || data.data.length === 0) {
                    url = `https://api.scryfall.com/cards/search?q=${encodeURIComponent(baseQuery)}&unique=prints`;
                    response = await fetch(url);
                    data = await response.json();
                }

                if (data.data && data.data.length > 0) {
                    currentTokensList = data.data;
                    setSelect.innerHTML = ""; 
                    let defaultIndex = 0;

                    currentTokensList.forEach((card, index) => {
                        let option = document.createElement("option");
                        option.value = index;
                        option.textContent = `${card.set_name} (${card.set.toUpperCase()}) - #${card.collector_number}`;
                        setSelect.appendChild(option);

                        if (card.set === 'ltr' || card.set === 'ltc') {
                            defaultIndex = index;
                        }
                    });

                    setSelect.value = defaultIndex;
                    setSelectorContainer.style.display = "flex";
                    displayCard(currentTokensList[defaultIndex]);
                } else { 
                    statusText.textContent = "Aucun token correspondant trouvé."; 
                }
            } catch (error) { 
                statusText.textContent = "Erreur de connexion à Scryfall."; 
            }
        }

        function displayCard(card) {
            let imageUrl = null;

            if (card.image_uris && card.image_uris.normal) { 
                imageUrl = card.image_uris.normal; 
            } else if (card.card_faces) {
                let faceIndex = 0;
                if (card.card_faces[1].name.toLowerCase().includes(currentSearchTerm.toLowerCase())) faceIndex = 1;
                if (card.card_faces[faceIndex].image_uris) imageUrl = card.card_faces[faceIndex].image_uris.normal;
            }

            if (imageUrl) {
                if(tokenImage.src !== imageUrl) {
                    tokenImage.src = imageUrl;
                } else {
                    processImageToCanvas(tokenImage);
                }

                originalWrapper.style.display = "flex";
                statusText.textContent = "Application du traitement...";
                
                tokenImage.onload = () => {
                    processImageToCanvas(tokenImage);
                    statusText.textContent = "Prêt à imprimer !";
                    printBtn.style.display = "block";
                    imageControls.style.display = "flex"; 
                };
            } else { 
                statusText.textContent = "Format d'image non géré pour cette carte."; 
            }
        }

        function processImageToCanvas(img) {
            const ratio = img.height / img.width;
            const targetWidth = PRINTER_WIDTH;
            const targetHeight = Math.round(targetWidth * ratio);

            ditheredCanvas.width = targetWidth;
            ditheredCanvas.height = targetHeight;
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imageData.data;

            const CONTRAST = parseFloat(contrastSlider.value);
            const BRIGHTNESS = parseInt(brightnessSlider.value);
            const ALGO = algoModeSelect.value;
            canvasLabel.textContent = ALGO === 'atkinson' ? "Prêt pour l'impression (Tramage Atkinson)" : "Prêt pour l'impression (Noir & Blanc basique)";

            for (let y = 0; y < targetHeight; y++) {
                for (let x = 0; x < targetWidth; x++) {
                    const index = (y * targetWidth + x) * 4;
                    let luminance = 0.299 * data[index] + 0.587 * data[index+1] + 0.114 * data[index+2];
                    luminance = (luminance - 128) * CONTRAST + 128 + BRIGHTNESS;
                    luminance = Math.max(0, Math.min(255, luminance)); 
                    
                    const newPixel = luminance < 128 ? 0 : 255;
                    data[index] = data[index+1] = data[index+2] = newPixel;
                    
                    if (ALGO === 'atkinson') {
                        const errorEighth = (luminance - newPixel) / 8;
                        if (x + 1 < targetWidth) addError(data, (y * targetWidth + (x + 1)) * 4, errorEighth);
                        if (x + 2 < targetWidth) addError(data, (y * targetWidth + (x + 2)) * 4, errorEighth);
                        if (y + 1 < targetHeight) {
                            if (x - 1 >= 0) addError(data, ((y + 1) * targetWidth + (x - 1)) * 4, errorEighth);
                            addError(data, ((y + 1) * targetWidth + x) * 4, errorEighth);
                            if (x + 1 < targetWidth) addError(data, ((y + 1) * targetWidth + (x + 1)) * 4, errorEighth);
                        }
                        if (y + 2 < targetHeight) addError(data, ((y + 2) * targetWidth + x) * 4, errorEighth);
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
            ditheredWrapper.style.display = "flex";
        }

        function addError(data, index, errorPart) {
            const val = data[index] + errorPart;
            data[index] = data[index+1] = data[index+2] = Math.max(0, Math.min(255, val));
        }

        printBtn.addEventListener('click', async () => {
            if (!navigator.bluetooth) {
                alert("Le Web Bluetooth n'est pas supporté sur ce navigateur.");
                return;
            }
            try {
                if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    statusText.textContent = "Recherche de l'imprimante Bluetooth...";
                    bluetoothDevice = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [BLE_SERVICE_UUID] });
                    const server = await bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                    bluetoothCharacteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
                }
                statusText.textContent = "Génération des données d'impression...";
                const printData = generateEscPosData();
                statusText.textContent = "Envoi à l'imprimante...";
                printBtn.textContent = "⏳ Impression...";
                printBtn.style.backgroundColor = "#ff9800";

                await sendChunks(printData);

                statusText.textContent = "Impression terminée !";
                printBtn.textContent = "🖨️ Connecter & Imprimer (v5)";
                printBtn.style.backgroundColor = "var(--success-color)";
                
            } catch (error) {
                console.error(error);
                statusText.textContent = "Erreur Bluetooth : " + error.message;
                printBtn.textContent = "🖨️ Réessayer";
                printBtn.style.backgroundColor = "#e53935";
            }
        });

        function generateEscPosData() {
    const width = ditheredCanvas.width;
    const height = ditheredCanvas.height;
    const pixels = ctx.getImageData(0, 0, width, height).data;
    const widthBytes = Math.ceil(width / 8); 
    
    const buffer = new Uint8Array(11 + 8 + (widthBytes * height) + 8);
    let offset = 0;

    // 1. En-tête propriétaire Phomemo
    buffer.set([0x1B, 0x4E, 0x0D, 0x05], offset); offset += 4; // Vitesse max
    buffer.set([0x1B, 0x4E, 0x04, 0x0F], offset); offset += 4; // Densité max
    buffer.set([0x1F, 0x11, 0x0B], offset); offset += 3;       // Type de papier : Continu

    // 2. Commande d'image standard ESC/POS
    buffer[offset++] = 0x1D; buffer[offset++] = 0x76; buffer[offset++] = 0x30; buffer[offset++] = 0x00;
    buffer[offset++] = widthBytes & 0xFF; buffer[offset++] = (widthBytes >> 8) & 0xFF;
    buffer[offset++] = height & 0xFF; buffer[offset++] = (height >> 8) & 0xFF;

    // 3. Conversion des pixels
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < widthBytes; x++) {
            let byte = 0;
            for (let bit = 0; bit < 8; bit++) {
                const pixelX = x * 8 + bit;
                if (pixelX < width) {
                    const idx = (y * width + pixelX) * 4;
                    if (pixels[idx] < 128) byte |= (1 << (7 - bit));
                }
            }
            buffer[offset++] = byte;
        }
    }

    // 4. Pied de page propriétaire Phomemo (Déclenchement du moteur)
    buffer.set([0x1F, 0xF0, 0x05, 0x00, 0x1F, 0xF0, 0x03, 0x00], offset);
    
    return buffer;
}

        async function sendChunks(data) {
    const CHUNK_SIZE = 50; 
    for (let i = 0; i < data.length; i += CHUNK_SIZE) {
        const chunk = data.slice(i, i + CHUNK_SIZE);
        await bluetoothCharacteristic.writeValue(chunk);
        // Pause stricte de 30ms pour laisser le tampon de l'imprimante se vider
        await new Promise(resolve => setTimeout(resolve, 30)); 
    }
}

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
