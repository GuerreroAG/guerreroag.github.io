<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Token Printer MTG</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9800">
    <link rel="apple-touch-icon" href="icon.png">
    
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --success-color: #4CAF50;
            --btn-bg: #2d2d2d;
            --btn-hover: #3d3d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #mic-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 1rem;
        }

        #mic-btn:active {
            transform: scale(0.95);
        }

        #mic-btn.listening {
            background-color: var(--accent-color);
            color: var(--bg-color);
            animation: pulse 1.5s infinite;
        }

        #status-text {
            font-size: 1rem;
            color: #aaaaaa;
            min-height: 1.5em;
            margin-bottom: 1.5rem;
        }

        #manual-search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
        }

        #manual-input {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--btn-hover);
            background-color: var(--btn-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        #search-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-hover);
            color: var(--text-color);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #quick-counters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 1.5rem;
            width: 100%;
            max-width: 384px;
        }

        .counter-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .counter-btn:active {
            transform: scale(0.95);
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        #result-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            min-height: 1.5em;
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        #set-selector-container {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 384px;
            margin-bottom: 15px;
            text-align: left;
        }

        #set-selector-container label {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            font-weight: bold;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--btn-hover);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .image-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        .image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        #token-image {
            display: block;
            width: 384px;
            max-width: 100%;
            border-radius: 8px;
        }

        #dithered-canvas {
            display: block;
            width: 384px;
            max-width: 100%;
            background-color: white;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        #image-controls {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 384px;
            background: var(--btn-bg);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .slider-group label {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .slider-group label span {
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        #print-btn {
            display: none;
            background-color: var(--success-color);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 40px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            width: 100%;
            max-width: 300px;
        }

        #print-btn:active {
            transform: scale(0.95);
            background-color: #45a049;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
    </style>
</head>
<body>

    <h1>Générateur de Token</h1>
    
    <button id="mic-btn" aria-label="Lancer la reconnaissance vocale">🎤</button>
    <div id="status-text">Appuie pour parler...</div>

    <div id="manual-search-container">
        <input type="text" id="manual-input" placeholder="Ou tape un nom (ex: chevalier 2/2)...">
        <button id="search-btn" aria-label="Rechercher">🔍</button>
    </div>

    <div id="quick-counters">
        <button class="counter-btn" onclick="generateCounter('+1 / +1')">+1 / +1</button>
        <button class="counter-btn" onclick="generateCounter('+5 / +5')">+5 / +5</button>
        <button class="counter-btn" onclick="generateCounter('-1 / -1')">-1 / -1</button>
        <button class="counter-btn" onclick="generateCounter('Vol')">Vol</button>
    </div>
    
    <div id="result-text"></div>

    <div id="set-selector-container">
        <label for="set-select">Illustration :</label>
        <select id="set-select"></select>
    </div>
    
    <div class="image-container">
        <div class="image-wrapper" id="original-wrapper" style="display: none;">
            <div class="image-label">Source Scryfall</div>
            <img id="token-image" src="" alt="Aperçu Original" crossorigin="anonymous">
        </div>
        
        <div class="image-wrapper" id="dithered-wrapper" style="display: none;">
            <div class="image-label" id="canvas-label">Prêt pour l'impression</div>
            <canvas id="dithered-canvas"></canvas>
        </div>
    </div>

    <div id="image-controls">
        <div class="slider-group">
            <label for="algo-mode">Mode de rendu :</label>
            <select id="algo-mode">
                <option value="atkinson">Tramage d'Atkinson (Nuances)</option>
                <option value="threshold">Noir & Blanc basique (Seuillage)</option>
            </select>
        </div>
        <div class="slider-group">
            <label for="brightness">Luminosité : <span id="bright-val">30</span></label>
            <input type="range" id="brightness" min="-50" max="100" value="30">
        </div>
        <div class="slider-group">
            <label for="contrast">Contraste : <span id="contr-val">1.35</span></label>
            <input type="range" id="contrast" min="0.5" max="2.5" step="0.05" value="1.35">
        </div>
    </div>

    <button id="print-btn">🖨️ Connecter & Imprimer (v14)</button>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const resultText = document.getElementById('result-text');
        const tokenImage = document.getElementById('token-image');
        const originalWrapper = document.getElementById('original-wrapper');
        const ditheredWrapper = document.getElementById('dithered-wrapper');
        const canvasLabel = document.getElementById('canvas-label');
        const manualInput = document.getElementById('manual-input');
        const searchBtn = document.getElementById('search-btn');
        const printBtn = document.getElementById('print-btn');
        const ditheredCanvas = document.getElementById('dithered-canvas');
        const ctx = ditheredCanvas.getContext('2d', { willReadFrequently: true });
        
        const setSelectorContainer = document.getElementById('set-selector-container');
        const setSelect = document.getElementById('set-select');
        
        const imageControls = document.getElementById('image-controls');
        const brightnessSlider = document.getElementById('brightness');
        const contrastSlider = document.getElementById('contrast');
        const algoModeSelect = document.getElementById('algo-mode');
        const brightVal = document.getElementById('bright-val');
        const contrVal = document.getElementById('contr-val');

        const PRINTER_WIDTH = 384; 
        const BLE_SERVICE_UUID = "0000ff00-0000-1000-8000-00805f9b34fb";
        const BLE_CHARACTERISTIC_UUID = "0000ff02-0000-1000-8000-00805f9b34fb";
        
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let currentTokensList = [];
        let currentSearchTerm = "";
