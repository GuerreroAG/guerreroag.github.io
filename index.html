<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Token Printer MTG</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --success-color: #4CAF50;
            --btn-bg: #2d2d2d;
            --btn-hover: #3d3d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #mic-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 1rem;
        }

        #mic-btn:active {
            transform: scale(0.95);
        }

        #mic-btn.listening {
            background-color: var(--accent-color);
            color: var(--bg-color);
            animation: pulse 1.5s infinite;
        }

        #status-text {
            font-size: 1rem;
            color: #aaaaaa;
            min-height: 1.5em;
            margin-bottom: 1.5rem;
        }

        #manual-search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 1rem;
        }

        #manual-input {
            flex-grow: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--btn-hover);
            background-color: var(--btn-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        #search-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--btn-hover);
            color: var(--text-color);
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        #result-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            min-height: 1.5em;
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        .image-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
            width: 100%;
        }

        .image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        #token-image {
            display: block;
            width: 384px;
            max-width: 100%;
            border-radius: 8px;
        }

        #dithered-canvas {
            display: block;
            width: 384px;
            max-width: 100%;
            background-color: white;
            border-radius: 8px;
            image-rendering: pixelated;
        }

        #image-controls {
            display: none;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 384px;
            background: var(--btn-bg);
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .slider-group label {
            font-size: 0.9rem;
            color: var(--text-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .slider-group label span {
            color: var(--accent-color);
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        select#algo-mode {
            padding: 10px;
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--btn-hover);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        #print-btn {
            display: none;
            background-color: var(--success-color);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            margin-bottom: 40px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            width: 100%;
            max-width: 300px;
        }

        #print-btn:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
    </style>
</head>
<body>

    <h1>Générateur de Token</h1>
    
    <button id="mic-btn" aria-label="Lancer la reconnaissance vocale">🎤</button>
    <div id="status-text">Appuie pour parler...</div>

    <div id="manual-search-container">
        <input type="text" id="manual-input" placeholder="Ou tape un nom...">
        <button id="search-btn" aria-label="Rechercher">🔍</button>
    </div>
    
    <div id="result-text"></div>
    
    <div class="image-container">
        <div class="image-wrapper" id="original-wrapper" style="display: none;">
            <div class="image-label">Source Scryfall</div>
            <img id="token-image" src="" alt="Aperçu Original" crossorigin="anonymous">
        </div>
        
        <div class="image-wrapper" id="dithered-wrapper" style="display: none;">
            <div class="image-label" id="canvas-label">Prêt pour l'impression</div>
            <canvas id="dithered-canvas"></canvas>
        </div>
    </div>

    <div id="image-controls">
        <div class="slider-group">
            <label for="algo-mode">Mode de rendu :</label>
            <select id="algo-mode">
                <option value="atkinson">Tramage d'Atkinson (Nuances)</option>
                <option value="threshold">Noir & Blanc basique (Seuillage)</option>
            </select>
        </div>
        <div class="slider-group">
            <label for="brightness">Luminosité : <span id="bright-val">30</span></label>
            <input type="range" id="brightness" min="-50" max="100" value="30">
        </div>
        <div class="slider-group">
            <label for="contrast">Contraste : <span id="contr-val">1.35</span></label>
            <input type="range" id="contrast" min="0.5" max="2.5" step="0.05" value="1.35">
        </div>
    </div>

    <button id="print-btn">🖨️ Connecter & Imprimer</button>

    <script>
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const resultText = document.getElementById('result-text');
        const tokenImage = document.getElementById('token-image');
        const originalWrapper = document.getElementById('original-wrapper');
        const ditheredWrapper = document.getElementById('dithered-wrapper');
        const canvasLabel = document.getElementById('canvas-label');
        const manualInput = document.getElementById('manual-input');
        const searchBtn = document.getElementById('search-btn');
        const printBtn = document.getElementById('print-btn');
        const ditheredCanvas = document.getElementById('dithered-canvas');
        const ctx = ditheredCanvas.getContext('2d', { willReadFrequently: true });
        
        const imageControls = document.getElementById('image-controls');
        const brightnessSlider = document.getElementById('brightness');
        const contrastSlider = document.getElementById('contrast');
        const algoModeSelect = document.getElementById('algo-mode');
        const brightVal = document.getElementById('bright-val');
        const contrVal = document.getElementById('contr-val');

        const PRINTER_WIDTH = 384; 

        // UUID spécifiques de la Phomemo M110 pour le Bluetooth
        const BLE_SERVICE_UUID = "0000ff00-0000-1000-8000-00805f9b34fb";
        const BLE_CHARACTERISTIC_UUID = "0000ff02-0000-1000-8000-00805f9b34fb";
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        const tokenDictionary = {
            "tresor": "treasure", "elfe": "elf", "nourriture": "food", "orque": "orc",
            "armee d'orques": "orc army", "gobelin": "goblin", "bete": "beast",
            "humain": "human", "soldat": "soldier", "zombie": "zombie", "esprit": "spirit",
            "dinosaure": "dinosaur", "plante": "plant"
        };

        function resetUI() {
            originalWrapper.style.display = "none";
            ditheredWrapper.style.display = "none";
            printBtn.style.display = "none";
            imageControls.style.display = "none";
        }

        brightnessSlider.addEventListener('input', () => { brightVal.textContent = brightnessSlider.value; if (tokenImage.src) processImageToCanvas(tokenImage); });
        contrastSlider.addEventListener('input', () => { contrVal.textContent = contrastSlider.value; if (tokenImage.src) processImageToCanvas(tokenImage); });
        algoModeSelect.addEventListener('change', () => { if (tokenImage.src) processImageToCanvas(tokenImage); });

        function processQuery(text) {
            resultText.textContent = text;
            let normalizedText = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let cleanWord = normalizedText.replace(/\b(imprime|un|une|le|la|les|des|de|jeton)\b/g, '').trim();
            cleanWord = cleanWord.replace(/\s+/g, ' '); 
            let englishTerm = tokenDictionary[cleanWord] || cleanWord;
            resetUI();
            fetchTokenFromScryfall(englishTerm);
        }

        searchBtn.addEventListener('click', () => { if (manualInput.value) processQuery(manualInput.value); });
        manualInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && manualInput.value) { manualInput.blur(); processQuery(manualInput.value); } });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.textContent = "Reconnaissance vocale non supportée.";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            micBtn.addEventListener('click', () => recognition.start());
            
            recognition.onstart = () => {
                micBtn.classList.add('listening');
                statusText.textContent = "Je t'écoute...";
                resetUI();
                manualInput.value = "";
            };
            
            recognition.onspeechend = () => micBtn.classList.remove('listening');
            recognition.onresult = (e) => processQuery(e.results[0][0].transcript);
            recognition.onerror = (e) => { micBtn.classList.remove('listening'); statusText.textContent = `Erreur : ${e.error}`; };
        }

        async function fetchTokenFromScryfall(tokenName) {
            statusText.textContent = `Recherche de "${tokenName}"...`;
            try {
                let response = await fetch(`https://api.scryfall.com/cards/search?q=t:token+name:"${tokenName}"+(set:ltr+OR+set:ltc)`);
                let data = await response.json();

                if (!data.data || data.data.length === 0) {
                    response = await fetch(`https://api.scryfall.com/cards/search?q=t:token+name:"${tokenName}"`);
                    data = await response.json();
                }

                if (data.data && data.data.length > 0) {
                    const card = data.data[0];
                    let imageUrl = null;

                    if (card.image_uris && card.image_uris.normal) { imageUrl = card.image_uris.normal; } 
                    else if (card.card_faces) {
                        let faceIndex = 0;
                        if (card.card_faces[1].name.toLowerCase().includes(tokenName.toLowerCase())) faceIndex = 1;
                        if (card.card_faces[faceIndex].image_uris) imageUrl = card.card_faces[faceIndex].image_uris.normal;
                    }

                    if (imageUrl) {
                        if(tokenImage.src !== imageUrl) tokenImage.src = imageUrl;
                        else processImageToCanvas(tokenImage);

                        originalWrapper.style.display = "flex";
                        statusText.textContent = "Application du traitement...";
                        
                        tokenImage.onload = () => {
                            processImageToCanvas(tokenImage);
                            statusText.textContent = "Prêt à imprimer !";
                            printBtn.style.display = "block";
                            imageControls.style.display = "flex"; 
                        };
                    } else { statusText.textContent = "Format d'image non géré pour cette carte."; }
                } else { statusText.textContent = "Aucun token trouvé."; }
            } catch (error) { statusText.textContent = "Erreur de connexion à Scryfall."; }
        }

        function processImageToCanvas(img) {
            const ratio = img.height / img.width;
            const targetWidth = PRINTER_WIDTH;
            const targetHeight = Math.round(targetWidth * ratio);

            ditheredCanvas.width = targetWidth;
            ditheredCanvas.height = targetHeight;
            ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imageData.data;

            const CONTRAST = parseFloat(contrastSlider.value);
            const BRIGHTNESS = parseInt(brightnessSlider.value);
            const ALGO = algoModeSelect.value;
            canvasLabel.textContent = ALGO === 'atkinson' ? "Prêt pour l'impression (Tramage Atkinson)" : "Prêt pour l'impression (Noir & Blanc basique)";

            for (let y = 0; y < targetHeight; y++) {
                for (let x = 0; x < targetWidth; x++) {
                    const index = (y * targetWidth + x) * 4;
                    let luminance = 0.299 * data[index] + 0.587 * data[index+1] + 0.114 * data[index+2];
                    luminance = (luminance - 128) * CONTRAST + 128 + BRIGHTNESS;
                    luminance = Math.max(0, Math.min(255, luminance)); 
                    
                    const newPixel = luminance < 128 ? 0 : 255;
                    data[index] = data[index+1] = data[index+2] = newPixel;
                    
                    if (ALGO === 'atkinson') {
                        const errorEighth = (luminance - newPixel) / 8;
                        if (x + 1 < targetWidth) addError(data, (y * targetWidth + (x + 1)) * 4, errorEighth);
                        if (x + 2 < targetWidth) addError(data, (y * targetWidth + (x + 2)) * 4, errorEighth);
                        if (y + 1 < targetHeight) {
                            if (x - 1 >= 0) addError(data, ((y + 1) * targetWidth + (x - 1)) * 4, errorEighth);
                            addError(data, ((y + 1) * targetWidth + x) * 4, errorEighth);
                            if (x + 1 < targetWidth) addError(data, ((y + 1) * targetWidth + (x + 1)) * 4, errorEighth);
                        }
                        if (y + 2 < targetHeight) addError(data, ((y + 2) * targetWidth + x) * 4, errorEighth);
                    }
                }
            }
            ctx.putImageData(imageData, 0, 0);
            ditheredWrapper.style.display = "flex";
        }

        function addError(data, index, errorPart) {
            const val = data[index] + errorPart;
            data[index] = data[index+1] = data[index+2] = Math.max(0, Math.min(255, val));
        }

        // --- NOUVEAU MOTEUR BLUETOOTH ESC/POS ---

        // Événement clic sur le bouton Valider
        printBtn.addEventListener('click', async () => {
            if (!navigator.bluetooth) {
                alert("Le Web Bluetooth n'est pas supporté sur ce navigateur (utilise Chrome sur ton Pixel).");
                return;
            }

            try {
                // Étape 1 : Connexion Bluetooth (demande à l'utilisateur)
                if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                    statusText.textContent = "Recherche de l'imprimante Bluetooth...";
                    bluetoothDevice = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: [BLE_SERVICE_UUID]
                    });
                    
                    const server = await bluetoothDevice.gatt.connect();
                    const service = await server.getPrimaryService(BLE_SERVICE_UUID);
                    bluetoothCharacteristic = await service.getCharacteristic(BLE_CHARACTERISTIC_UUID);
                }

                statusText.textContent = "Génération des données d'impression...";
                const printData = generateEscPosData();

                statusText.textContent = "Envoi à l'imprimante...";
                printBtn.textContent = "⏳ Impression...";
                printBtn.style.backgroundColor = "#ff9800";

                // Étape 2 : Envoi par petits paquets
                await sendChunks(printData);

                statusText.textContent = "Impression terminée !";
                printBtn.textContent = "🖨️ Valider & Imprimer";
                printBtn.style.backgroundColor = "var(--success-color)";
                
            } catch (error) {
                console.error(error);
                statusText.textContent = "Erreur Bluetooth : " + error.message;
                printBtn.textContent = "🖨️ Réessayer";
                printBtn.style.backgroundColor = "#e53935"; // Rouge erreur
            }
        });

        // Convertit le Canvas en bytes ESC/POS
        function generateEscPosData() {
            const width = ditheredCanvas.width;
            const height = ditheredCanvas.height;
            const pixels = ctx.getImageData(0, 0, width, height).data;
            const widthBytes = Math.ceil(width / 8); 

            // Taille du buffer : Header (8) + Données image + Sauts de ligne (4)
            const buffer = new Uint8Array(8 + (widthBytes * height) + 4);

            // Commande GS v 0 (Impression d'image raster matricielle)
            buffer[0] = 0x1D; 
            buffer[1] = 0x76; 
            buffer[2] = 0x30; 
            buffer[3] = 0x00; // Mode normal
            buffer[4] = widthBytes & 0xFF; // Largeur xL
            buffer[5] = (widthBytes >> 8) & 0xFF; // Largeur xH
            buffer[6] = height & 0xFF; // Hauteur yL
            buffer[7] = (height >> 8) & 0xFF; // Hauteur yH

            let offset = 8;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < widthBytes; x++) {
                    let byte = 0;
                    for (let bit = 0; bit < 8; bit++) {
                        const pixelX = x * 8 + bit;
                        if (pixelX < width) {
                            const idx = (y * width + pixelX) * 4;
                            // Si le pixel rouge (R) est noir (0), on met un bit à 1 pour chauffer
                            if (pixels[idx] < 128) {
                                byte |= (1 << (7 - bit));
                            }
                        }
                    }
                    buffer[offset++] = byte;
                }
            }

            // Faire avancer le papier de 4 lignes pour sortir l'image des rouleaux
            buffer[offset++] = 0x0A; 
            buffer[offset++] = 0x0A;
            buffer[offset++] = 0x0A;
            buffer[offset++] = 0x0A;

            return buffer;
        }

        // Fonction d'envoi découpé pour ne pas faire planter le Bluetooth
        async function sendChunks(data) {
            const CHUNK_SIZE = 100; // La Phomemo gère bien les paquets de 100 octets
            for (let i = 0; i < data.length; i += CHUNK_SIZE) {
                const chunk = data.slice(i, i + CHUNK_SIZE);
                await bluetoothCharacteristic.writeValue(chunk);
                // Petite pause de 20ms pour laisser l'imprimante digérer le paquet
                await new Promise(resolve => setTimeout(resolve, 20));
            }
        }
    </script>
</body>
</html>
